<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Minimal redirect stub. Chrome applies "focus the omnibox" behaviour to
    pages registered under chrome_url_overrides → newtab. By immediately
    replacing the history entry with app.html (a plain extension resource URL
    that is NOT registered as newtab), we escape that special treatment and
    autofocus works reliably in app.html.

    window.location.replace is used so no back-stack entry for newtab.html
    is created — the browser history shows app.html?x as the new-tab entry.
  -->
  <style>html,body{margin:0;background:#1c1c1e}</style>
  <script>
    window.location.replace(chrome.runtime.getURL("app.html?x"));
  </script>
</head>
<body>
  <!-- Fallback if JS is disabled -->
  <a href="app.html" style="color:#f5f5f7;font-family:sans-serif;padding:20px;display:block">
    Open LaunchTab →
  </a>
</body>
</html>
