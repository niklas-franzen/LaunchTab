<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LaunchTab – Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1c1e;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 40px;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    p  { color: #a1a1a6; font-size: 14px; max-width: 480px; text-align: center; }
    .canvases { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
    .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .icon-wrap span { font-size: 12px; color: #6e6e73; }
    button {
      margin-top: 8px;
      padding: 12px 28px;
      background: #0a84ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    button:hover { background: #0070e0; }
    .note {
      font-size: 12px;
      color: #6e6e73;
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>LaunchTab – Icon Generator</h1>
  <p>Opens in your browser, draws the extension icons using Canvas, and downloads all four PNG sizes at once.</p>

  <div class="canvases" id="canvases"></div>

  <button id="downloadAll">Download all icons</button>

  <p class="note">
    Save the downloaded files into <code>assets/icons/</code> inside the LaunchTab project folder.
    You only need to run this once.
  </p>

  <!-- NOTE: This file is a development tool only.
       Do NOT include generate-icons.html or generate-icons.js in the
       Chrome Web Store ZIP upload — they are not needed by the extension. -->
  <script src="generate-icons.js"></script>
</body>
</html>
