<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LaunchTab – Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1c1e;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 40px;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    p  { color: #a1a1a6; font-size: 14px; max-width: 480px; text-align: center; }
    .canvases { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
    .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .icon-wrap span { font-size: 12px; color: #6e6e73; }
    button {
      margin-top: 8px;
      padding: 12px 28px;
      background: #0a84ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    button:hover { background: #0070e0; }
    .note {
      font-size: 12px;
      color: #6e6e73;
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>LaunchTab – Icon Generator</h1>
  <p>Opens in your browser, draws the extension icons using Canvas, and downloads all four PNG sizes at once.</p>

  <div class="canvases" id="canvases"></div>

  <button id="downloadAll">Download all icons</button>

  <p class="note">
    Save the downloaded files into <code>assets/icons/</code> inside the LaunchTab project folder.
    You only need to run this once.
  </p>

  <script>
    const SIZES = [16, 32, 48, 128];

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext("2d");
      canvas.width  = size;
      canvas.height = size;

      const r = size * 0.22; // corner radius

      // Background
      ctx.fillStyle = "#1c1c1e";
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, r);
      ctx.fill();

      // Subtle inner glow ring
      const grd = ctx.createRadialGradient(
        size * 0.5, size * 0.35, 0,
        size * 0.5, size * 0.35, size * 0.6
      );
      grd.addColorStop(0, "rgba(10,132,255,0.12)");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, r);
      ctx.fill();

      // Accent circle (blue dot in the centre, scaled)
      const cx      = size * 0.5;
      const cy      = size * 0.48;
      const dotR    = size * 0.28;

      ctx.fillStyle = "#0a84ff";
      ctx.beginPath();
      ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
      ctx.fill();

      // Draw "L" letter centred on the dot
      ctx.fillStyle = "#ffffff";
      ctx.font = `600 ${Math.round(size * 0.3)}px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif`;
      ctx.textAlign    = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("L", cx, cy + size * 0.01);
    }

    const container = document.getElementById("canvases");

    SIZES.forEach(size => {
      const wrap   = document.createElement("div");
      wrap.className = "icon-wrap";
      const canvas = document.createElement("canvas");
      drawIcon(canvas, size);
      const label  = document.createElement("span");
      label.textContent = `${size}×${size}`;
      wrap.appendChild(canvas);
      wrap.appendChild(label);
      container.appendChild(wrap);
    });

    document.getElementById("downloadAll").addEventListener("click", () => {
      const canvases = container.querySelectorAll("canvas");
      canvases.forEach((canvas, i) => {
        const size = SIZES[i];
        const a    = document.createElement("a");
        a.href     = canvas.toDataURL("image/png");
        a.download = `icon${size}.png`;
        a.click();
      });
    });
  </script>
</body>
</html>
