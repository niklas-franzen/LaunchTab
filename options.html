<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaunchTab Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">

    <header class="page-header">
      <div class="header-brand">
        <span class="brand-dot"></span>
        <span class="brand-name">LaunchTab</span>
        <span class="brand-sub">Settings</span>
      </div>
      <button id="btn-reset" class="btn btn-ghost btn-sm">Reset to defaults</button>
    </header>

    <div class="toolbar">
      <input id="filter-input" type="text" class="filter-input"
             placeholder="Filter shortcuts…" autocomplete="off" spellcheck="false">
      <button id="btn-add" class="btn btn-primary">+ Add shortcut</button>
    </div>

    <div id="shortcut-list" class="shortcut-list" role="list"></div>

    <!-- Add / Edit form — hidden until user clicks Add or Edit -->
    <div id="form-card" class="form-card" hidden>
      <h2 id="form-title" class="form-card-title">Add shortcut</h2>

      <div class="form-grid">
        <label class="field-wrap">
          <span class="field-label">Shortcut key</span>
          <input id="f-key" type="text" class="field-input field-mono"
                 placeholder="e.g. gh" maxlength="20" autocomplete="off" spellcheck="false">
        </label>
        <label class="field-wrap">
          <span class="field-label">Name</span>
          <input id="f-name" type="text" class="field-input"
                 placeholder="e.g. GitHub" maxlength="80" autocomplete="off">
        </label>
        <label class="field-wrap field-wrap--full">
          <span class="field-label">URL</span>
          <input id="f-url" type="text" class="field-input"
                 placeholder="https://github.com" autocomplete="off" spellcheck="false">
        </label>
        <label class="field-wrap">
          <span class="field-label">Category</span>
          <input id="f-category" type="text" class="field-input"
                 placeholder="e.g. Dev" maxlength="40" autocomplete="off">
        </label>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="form-actions">
        <button id="btn-save" class="btn btn-primary">Save</button>
        <button id="btn-cancel" class="btn btn-ghost">Cancel</button>
      </div>
    </div>

    <div id="status-banner" class="status-banner" hidden></div>

  </div>

  <script src="defaults.js"></script>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
