<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaunchTab</title>
  <!-- themes.js first: applies saved theme from localStorage before first paint (no FOUC) -->
  <script src="themes.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Clock / date — fixed top right -->
  <aside class="clock-widget" aria-label="Current time and date">
    <time id="time" class="clock-time" datetime=""></time>
    <time id="date" class="clock-date" datetime=""></time>
    <!-- Weather widget — rendered here; hidden until data loads -->
    <div id="weather-widget" class="weather-widget" hidden aria-live="polite"></div>
  </aside>

  <!-- Central launcher -->
  <main class="launcher" id="launcher" role="main">

    <h1 class="greeting" aria-label="Launcher heading">Where to?</h1>

    <!-- Search -->
    <div class="search-wrapper" role="search">
      <svg class="search-icon" aria-hidden="true" focusable="false"
           viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round"/>
      </svg>

      <input
        id="search"
        class="search-input"
        type="text"
        placeholder="Type a shortcut, name, or search…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
        aria-label="Search shortcuts"
        aria-autocomplete="list"
        aria-controls="results"
        aria-expanded="false"
        aria-haspopup="listbox"
        role="combobox"
      />

      <span class="search-clear" id="search-clear" role="button"
            aria-label="Clear search" tabindex="-1" hidden>
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round"/>
        </svg>
      </span>

      <kbd class="search-kbd-hint" aria-label="Keyboard shortcut: Command K">⌘K</kbd>
    </div>

    <!-- Results dropdown — hidden until query is non-empty -->
    <div id="results-container" class="results-container" hidden aria-live="polite">
      <ul
        id="results"
        class="results-list"
        role="listbox"
        aria-label="Matching shortcuts"
      ></ul>
      <p id="no-results" class="no-results" hidden>No shortcuts found.</p>
    </div>

    <!-- Default grid — shown when search is empty -->
    <div id="default-grid" class="default-grid" aria-label="Quick access shortcuts">
    </div>

  </main>

  <!-- Keyboard hints — outside .launcher (which has transform) so position:fixed works -->
  <footer class="kbd-hints" id="kbd-hints" role="contentinfo" aria-label="Keyboard navigation hints">
    <span><kbd>Enter</kbd> open</span>
    <span class="hints-sep" aria-hidden="true">·</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
    <span class="hints-sep" aria-hidden="true">·</span>
    <span><kbd>Esc</kbd> clear</span>
  </footer>

  <!-- Settings gear button — fixed bottom-right -->
  <button id="settings-btn" class="settings-btn" title="Settings" aria-label="Open Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <script src="defaults.js"></script>
  <script src="storage.js"></script>
  <script src="search-engines.js"></script>
  <script src="weather.js"></script>
  <script src="bookmarks.js"></script>
  <script src="script.js"></script>
</body>
</html>
